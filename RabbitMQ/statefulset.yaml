apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabitmq
  namespace: rabbitmq
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rabitmq
  template:
    metadata:
      name: rabitmq
      labels:
        app: rabitmq
    spec:
      containers:
        - name: rabitmq
          image: rabitmq:management
          ports:
            -containerPort: 5672 # AMQP
            -containerPort: 15672  # Web UI