apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: rabbitmq
spec:
  #serviceName: "rabbitmq"
  replicas: 3
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:management
          ports:
            - containerPort: 5672  # AMQP
            - containerPort: 15672 # Web UI
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                configMapKeyRef:
                              name: rabbitmq-config
                              key: default_user 
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                configMapKeyRef:
                              name: rabbitmq-config
                              key: default_password
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
